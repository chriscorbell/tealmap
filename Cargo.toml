[package]
name = "tealmap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
boxcar = "0.2.14"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
lz4_flex = "0.14.0"
mime_guess = "2.0.5"
libdeflater = "1"
png = "0.18.1"
rayon = "1.12.0"
rustc-hash = "2.1.1"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = "9.1.2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
